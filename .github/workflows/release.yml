name: release

# Push a tag like v0.6.0 to publish a portable build automatically.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Build
        shell: pwsh
        run: .\build.ps1 -NoTest

      - name: Package portable zip
        shell: pwsh
        run: .\package.ps1 -SkipBuild

      - name: Keep the zip as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: GhostHand-win64
          path: release/*.zip
          if-no-files-found: error

      - name: Attach to the GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.zip
          generate_release_notes: true
          body: |
            ## Ghost Hand

            **No installation and no commands.** Download the zip below, extract it
            anywhere, and double-click `GhostHand.exe`.

            - Windows may warn that the app is unsigned: *More info → Run anyway*.
            - The first launch opens a short guide, then the camera preview.
            - `Install shortcuts.cmd` in the zip adds Start-menu and desktop shortcuts.
            - Settings live next to the exe, so the folder is portable.

            Needs Windows 10/11 and an Intel RealSense D435 for depth features.
